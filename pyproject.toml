[project]
name = "loola-agent"
version = "0.1.0"
description = "Minimal async coding agent SDK + CLI (Loola test task)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.4",
]

[project.scripts]
loola-agent = "loola_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: calls real external services (run with `pytest -m live`)"]
